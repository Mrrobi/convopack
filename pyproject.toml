[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "convopack"
version = "0.1.0.dev0"
description = "Framework-agnostic, provider-agnostic context-window packer for LLM chat history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "robi", email = "robi@hjemla.no" }]
keywords = [
  "llm",
  "openai",
  "anthropic",
  "context-window",
  "chat",
  "tokenizer",
  "memory",
  "prompt",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
anthropic = ["anthropic>=0.40"]
all = ["tiktoken>=0.7", "anthropic>=0.40"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.10",
  "tiktoken>=0.7",
  "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/hjemla/convopack"
Repository = "https://github.com/hjemla/convopack"
Issues = "https://github.com/hjemla/convopack/issues"
Changelog = "https://github.com/hjemla/convopack/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/convopack"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
  "PT",
  "TID",
  "PIE",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/convopack"]

[[tool.mypy.overrides]]
module = ["tiktoken.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]
