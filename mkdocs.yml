site_name: convopack
site_description: Framework-agnostic, provider-agnostic context-window packer for LLM chat history
site_url: https://mrrobi.github.io/convopack/
repo_name: Mrrobi/convopack
repo_url: https://github.com/Mrrobi/convopack
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: numpy
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guide:
      - Strategies: guide/strategies.md
      - Tokenizers: guide/tokenizers.md
      - Providers: guide/providers.md
      - Pinning: guide/pinning.md
      - Streaming events: guide/events.md
  - Recipes:
      - OpenAI chat loop: recipes/openai-loop.md
      - Anthropic agent with tools: recipes/anthropic-tools.md
      - Async summarisation: recipes/async-summary.md
      - Custom importance scoring: recipes/importance.md
  - Why convopack: comparison.md
  - API reference: api.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Mrrobi/convopack
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/convopack/
